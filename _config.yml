# ==========================================================
# Hexo 站点主配置 ---- 个人博客
# 官方文档：https://hexo.io/docs/configuration.html
# ==========================================================

# ---------- 站点信息 ----------
title: ZHshen 的博客
subtitle: '记录 · 思考 · 分享'
description: '一个关于技术、学习与生活的个人站点'
keywords: 'Hexo, 博客, 前端, 技术, 生活'
author: ZHshen
language: zh-CN
timezone: 'Asia/Shanghai'

# ---------- 网址 ----------
## 部署到 GitHub Pages 后请把 url 改成你自己的地址，例如：
##   个人主页仓库（仓库名 username.github.io）：https://username.github.io
##   普通仓库（仓库名 my-blog）：https://username.github.io/my-blog  （同时把 root 设为 /my-blog/）
url: https://yourname.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # 设为 false 可去掉 URL 末尾的 index.html
  trailing_html: true # 设为 false 可去掉 URL 末尾的 .html

# ---------- 目录 ----------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------- 写作 ----------
new_post_name: :title.md # 新文章文件名
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false # 设为 true 可让每篇文章拥有独立的资源文件夹
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# ---------- 首页 ----------
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ---------- 分类与标签 ----------
default_category: uncategorized
category_map:
tag_map:

# ---------- 元数据 ----------
meta_generator: true

# ---------- 日期格式 ----------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option 支持 'mtime'（文件修改时间）、'date'（文章 front-matter 的 updated）、'empty'
updated_option: 'date'

# ---------- 分页 ----------
per_page: 10
pagination_dir: page

# ---------- 包含 / 排除 ----------
include:
exclude:
ignore:

# ---------- 主题 ----------
## 主题通过 npm 安装：npm install hexo-theme-butterfly
## 主题配置位于根目录 _config.butterfly.yml
theme: butterfly

# ---------- 部署 ----------
## 方式二：本地一条命令部署（方式一为 GitHub Actions，见 .github/workflows/deploy.yml）
## 使用前把 repo 换成你自己的仓库地址，并按 README 配置好 GitHub Token / SSH 密钥
deploy:
  type: git
  repo: https://github.com/yourname/yourname.github.io.git
  branch: main
  message: 'Site updated: {{ now("YYYY-MM-DD HH:mm:ss") }}'
